<!DOCTYPE html>
<html>

<head>
    <title>Voting Results</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1828/1828919.png">
</head>

<body>

    <div class="box">

        <h2>Voting Results</h2>

        <div class="title-divider">
            <span></span>
            ★
            <span></span>
        </div>

        <!-- BJP -->
        <div class="result-box" id="bjpBox">

            <div class="party-info">
                <img src="../assets/images/bjp.png" class="party-logo">
                <span class="party-name">BJP</span>
            </div>

            <div class="party-result">
                <b id="bjpVotes">0</b>

                <div class="vertical-line"></div>

                <span class="percent" id="bjpPercent">0%</span>
            </div>

        </div>

        <!-- BJD -->
        <div class="result-box" id="bjdBox">

            <div class="party-info">
                <img src="../assets/images/bjd.png" class="party-logo">
                <span class="party-name">BJD</span>
            </div>

            <div class="party-result">
                <b id="bjdVotes">0</b>

                <div class="vertical-line"></div>

                <span class="percent" id="bjdPercent">0%</span>
            </div>

        </div>

        <!-- Congress -->
        <div class="result-box" id="conBox">

            <div class="party-info">
                <img src="../assets/images/congress.png" class="party-logo">
                <span class="party-name">Congress</span>
            </div>

            <div class="party-result">
                <b id="conVotes">0</b>

                <div class="vertical-line"></div>

                <span class="percent" id="conPercent">0%</span>
            </div>

        </div>

        <p id="statusText"></p>

        <hr>

        <a class="back-btn" href="../index.html">
            ← Back to Login
        </a>

    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Custom Modal -->
    <div id="customModal" class="custom-modal">
        <div class="modal-box">

            <h3 id="modalTitle">Alert</h3>

            <p id="modalMessage"></p>

            <div id="modalInputArea"></div>

            <div class="modal-buttons">
                <button id="modalOkBtn">OK</button>
                <button id="modalCancelBtn">Cancel</button>
            </div>

        </div>
    </div>
    <div id="fireworks"></div>


    <script src="../js/storage.js"></script>
    <script src="../js/result.js"></script>
    <script src="../js/confetti.js"></script>
    <script src="../js/ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.x/dist/index.umd.js"></script>

    <canvas id="confetti"></canvas>

</body>

</html>
