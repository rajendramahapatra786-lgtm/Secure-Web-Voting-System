<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Voters</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/manage.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1828/1828919.png">
</head>

<body>

    <div class="manage-box">

        <div class="table-header">

            <div class="title-box">
                <div class="title-icon">
                    👥
                </div>

                <h2>Voter List</h2>
            </div>

            <div class="search-box">

                <span class="search-icon">🔍</span>

                <input type="search" id="searchInput" placeholder="Search by Name, Mobile or Party..."
                    autocomplete="off">

            </div>

        </div>

        <div class="table-box">
            <table class="voter-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>User Name</th>
                        <th>Mobile</th>
                        <th>Party</th>
                        <th>Date</th>
                        <th>Select</th>
                    </tr>
                </thead>
                <tbody id="voterTableBody"></tbody>
            </table>
        </div>

        <br>

        <button class="delete-btn" id="deleteBtn">
            🗑 Delete Selected
        </button>

        <br><br>
        <a class="back-btn" href="vote.html">
            ← Back to Voting
        </a>

    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Custom Modal -->
    <div id="customModal" class="custom-modal">
        <div class="modal-box">

            <h3 id="modalTitle">Alert</h3>

            <p id="modalMessage"></p>

            <div id="modalInputArea"></div>

            <div class="modal-buttons">
                <button id="modalOkBtn">OK</button>
                <button id="modalCancelBtn">Cancel</button>
            </div>

        </div>
    </div>


    <script src="../js/storage.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/ui.js"></script>

    <!-- <script>
        loadVoters();
    </script> -->

</body>

</html>
