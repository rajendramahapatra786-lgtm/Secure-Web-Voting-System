<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vote</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/vote.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1828/1828919.png">

</head>

<body>

    <div class="vote-box">
        <h2>Cast Your Vote</h2>

        <!-- ✅ Admin Access Button -->
        <button id="adminBtn" class="admin-btn">
            Admin Panel
        </button>

        <!-- ✅ Hidden Admin Controls -->
        <div id="adminPanel" style="display:none; margin-top:15px;">
            <button id="toggleVotingBtn">Toggle Voting</button>
            <button id="restartVotingBtn">Restart Voting</button>
            <button type="button" id="managePageBtn">Manage Voters</button>
        </div>

        <!-- ✅ Voting Status Message -->
        <p id="statusMessage"></p>

        <!-- ✅ Voting Buttons -->
        <button class="party-btn" data-party="BJP">
            <span>BJP</span>
            <img src="../assets/images/bjp.png" class="party-logo" alt="BJP">
        </button>

        <button class="party-btn" data-party="BJD">
            <span>BJD </span>
            <img src="../assets/images/bjd.png" class="party-logo" alt="BJD">
        </button>

        <button class="party-btn" data-party="Congress">
            <span>Congress</span>
            <img src="../assets/images/congress.png" class="party-logo" alt="Congress">
        </button>

        <p id="msg" aria-live="polite"></p>

        <a href="result.html">View Results </a>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Custom Modal -->
    <div id="customModal" class="custom-modal">
        <div class="modal-box">

            <h3 id="modalTitle">Alert</h3>

            <p id="modalMessage"></p>

            <div id="modalInputArea"></div>

            <div class="modal-buttons">
                <button id="modalOkBtn">OK</button>
                <button id="modalCancelBtn">Cancel</button>
            </div>

        </div>
    </div>


    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/vote.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/admin.js"></script>


</body>

</html>
